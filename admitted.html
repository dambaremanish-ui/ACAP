<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admitted | Admission Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <div class="top-panel">
    <div class="top-panel-card">
      <div id="main-nav"></div> 
      
      <div class="action-bar">
        <input type="text" id="searchBox" placeholder="Search admitted students..." style="flex-grow:1;">
        <button id="syncBtn">↻ Sync Database</button>
      </div>
    </div>
  </div>
  
  <div class="data-panel">
    <div id="results">Loading database...</div>
    <div id="pagination" style="display:flex; gap:5px; margin-top:15px; justify-content:center; flex-wrap:wrap;"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/admitted.js"></script>
</body>
</html>
