<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | Admission Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #fff; padding: 15px; border: 1px solid var(--border); border-radius: 6px; }
    .checkbox-grid label { font-weight: normal; margin-bottom: 0; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container" id="main-nav" style="padding-bottom: 0; margin-bottom: 1rem; border-bottom-left-radius: 0; border-bottom-right-radius: 0; box-shadow: none;"></div>
  
  <div class="container" style="border-top-left-radius: 0; border-top-right-radius: 0;">
    <div class="sticky-header">
      <input type="text" id="searchBox" placeholder="Search users..." style="flex-grow:1;">
      <button style="background:#4f46e5;" onclick="openUserModal()">+ Add/Edit User</button>
      <button id="syncBtn">↻ Sync</button>
    </div>
    <div id="actionModalUsers"></div>
    <div id="results">Loading database...</div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
