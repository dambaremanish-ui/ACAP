<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Admission Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" id="main-nav" style="padding-bottom: 0; margin-bottom: 1rem; border-bottom-left-radius: 0; border-bottom-right-radius: 0; box-shadow: none;"></div>
  
  <div class="container" style="max-width:600px; border-top-left-radius: 0; border-top-right-radius: 0;">
    <h3 style="margin-bottom:5px;">Day-wise Criteria & Limits</h3>
    <p style="font-size:0.9rem; color:#6b7280; margin-bottom:20px;">Restricts operations for lower-level admins (Operators) who do not have access to this tab.</p>
    
    <div id="statusMsg" style="margin-bottom: 15px; font-weight: bold; color: var(--primary);">Loading current settings...</div>

    <div class="input-group">
        <label>Allowed Admission Date (Lock entry to this date only)</label>
        <input type="date" id="setLimitDate">
    </div>
    <div style="display:flex; gap:10px;">
        <div class="input-group" style="flex:1;">
            <label>Minimum CET Required</label>
            <input type="number" id="setMinCET" placeholder="e.g. 80">
        </div>
        <div class="input-group" style="flex:1;">
            <label>Maximum CET Allowed</label>
            <input type="number" id="setMaxCET" placeholder="e.g. 100">
        </div>
    </div>
    <div class="input-group">
        <label>Maximum State Merit No Allowed</label>
        <input type="number" id="setMaxMerit" placeholder="e.g. 1000">
    </div>
    
    <button style="background:#059669; width:100%; margin-top:15px; padding:12px;" onclick="saveSettings(event)">Save Constraints</button>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
