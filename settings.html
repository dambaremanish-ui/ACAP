<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"></head>
<body>
  <div class="data-panel" style="max-width: 600px;">
    <h3 style="margin-bottom:5px;">Day-wise Criteria & Limits</h3>
    <p style="font-size:0.9rem; color:var(--text-light); margin-bottom:20px;">Restricts operations for Operators.</p>
    <div id="statusMsg" style="margin-bottom: 15px; font-weight: bold; color: var(--primary);">Loading current settings...</div>
    <div class="input-group"><label>Allowed Admission Date</label><input type="date" id="setLimitDate"></div>
    <div style="display:flex; gap:10px;">
        <div class="input-group" style="flex:1;"><label>Minimum CET</label><input type="number" id="setMinCET"></div>
        <div class="input-group" style="flex:1;"><label>Maximum CET</label><input type="number" id="setMaxCET"></div>
    </div>
    <div class="input-group"><label>Maximum State Merit No</label><input type="number" id="setMaxMerit"></div>
    <button class="btn-success" style="width:100%; margin-top:15px; padding:12px;" onclick="saveSettings(event)">Save Constraints</button>
  </div>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
